<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor de la Sagrada Biblia</title>
<meta name="theme-color" content="#7a2e1f">
<meta name="description" content="Visor local de la Sagrada Biblia: navegación, búsqueda y notas. Cada persona carga su propio archivo de texto.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#fbf8f1; --ink:#2a2622; --muted:#7a7268; --accent:#7a2e1f; --accent-ink:#fff;
  --line:#e6dfd0; --note:#f1ebdd; --mark:#ffe08a; --hl:#fff3c4; --card:#fffdf8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:1.12rem;
}
:root[data-theme="dark"]{
  --bg:#16140f; --ink:#e8e2d4; --muted:#9a9181; --accent:#d68b6f; --accent-ink:#1a1209;
  --line:#2c2820; --note:#221f18; --mark:#6b5410; --hl:#2d2810; --card:#1c1913;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --ink:#e8e2d4; --muted:#9a9181; --accent:#d68b6f; --accent-ink:#1a1209;
    --line:#2c2820; --note:#221f18; --mark:#6b5410; --hl:#2d2810; --card:#1c1913;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* barra superior */
#bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + .45rem) max(.75rem,env(safe-area-inset-right)) .45rem max(.75rem,env(safe-area-inset-left));
  display:flex;gap:.5rem;align-items:center;font-family:var(--sans)}
#navBtn{flex:1;min-width:0;text-align:left;background:none;border:1px solid var(--line);border-radius:.6rem;
  padding:.5rem .75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#navBtn::after{content:" ▾";color:var(--muted)}
.ib{background:none;border:1px solid var(--line);border-radius:.6rem;width:2.6rem;height:2.6rem;display:grid;place-items:center;flex:none}
.ib svg{width:1.2rem;height:1.2rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#q{display:none;flex:2;min-width:0;border:1px solid var(--line);border-radius:.6rem;padding:.5rem .75rem;background:var(--card)}
#bar.s #q{display:block} #bar.s #navBtn{display:none}
@media(min-width:640px){#q{display:block}#navBtn{flex:1}#searchBtn{display:none}#bar.s #navBtn{display:block}}
/* contenido */
main{max-width:40rem;margin:0 auto;padding:1rem max(1rem,env(safe-area-inset-left)) 5.5rem}
body.allnotes.wide main{max-width:64rem}
h1.ch{font-size:1.7rem;line-height:1.2;margin:.8rem 0 .2rem;font-weight:600}
.bk{font-family:var(--sans);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tools{font-family:var(--sans);display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .4rem}
.btn{border:1px solid var(--line);background:var(--card);border-radius:.6rem;padding:.4rem .8rem;font-family:var(--sans);font-size:.9rem;text-decoration:none;color:inherit;display:inline-block}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.d{color:#b3261e;border-color:#b3261e}
h2.sec{font-family:var(--sans);font-size:.95rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin:2rem 0 .4rem;padding-top:.8rem;border-top:2px solid var(--line);font-weight:700}
h2.sec.big{font-size:1.25rem;border:0;text-align:center}
h3.sub{font-family:var(--sans);font-size:.85rem;margin:1.2rem 0 .3rem;font-weight:700}
h3.pe{font-family:var(--sans);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:1.5rem 0 .3rem;font-weight:700}
p.prose{margin:.5rem 0;font-size:1rem;line-height:1.55;color:var(--ink)}
.par{font-family:var(--sans);font-size:.78rem;color:var(--muted);margin:.1rem 0 .4rem}
.par a,.note a{color:var(--accent)}
.it{display:block}
.v{padding:.1rem .35rem;margin:0 -.35rem;border-radius:.4rem;scroll-margin-top:4.5rem}
.v.hl,.it.hl{background:var(--hl);border-radius:.4rem}
.vn{font-family:var(--sans);font-size:.68em;font-weight:700;color:var(--accent);vertical-align:.32em;margin-right:.3em;cursor:pointer;user-select:none}
.vn.ins{font-style:italic;font-weight:600;letter-spacing:.02em;margin-right:.5em}
.nm{font-family:var(--sans);font-size:.62em;font-weight:700;vertical-align:.5em;margin:0 .12em;padding:0 .3em;border:0;border-radius:.4em;background:var(--note);color:var(--accent);line-height:1.5}
.nm.on{background:var(--accent);color:var(--accent-ink)}
.note{font-family:var(--sans);font-size:.86rem;line-height:1.5;background:var(--note);border-left:3px solid var(--accent);border-radius:.3rem;padding:.5rem .7rem;margin:.35rem 0 .5rem}
.note p{margin:.25rem 0}
.note b{color:var(--accent);margin-right:.35em}
body.allnotes.wide .it{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:0 1.6rem;align-items:start}
body.allnotes.wide .it>.notes{grid-column:2;grid-row:1 / span 3}
body.allnotes.wide .it .note{margin-top:.1rem}
details.intro{margin:.6rem 0 1rem;font-family:var(--sans);font-size:.9rem;color:var(--muted)}
summary{cursor:pointer}
.doc{margin-top:.8rem}
/* pager */
#pager{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between;
  padding:.4rem max(.75rem,env(safe-area-inset-right)) calc(.4rem + env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left));font-family:var(--sans);z-index:4}
#pager button{background:none;border:1px solid var(--line);border-radius:.6rem;padding:.5rem 1rem;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pager button:disabled{visibility:hidden}
/* diálogos */
dialog{border:1px solid var(--line);border-radius:1rem;background:var(--bg);color:var(--ink);padding:0;width:min(34rem,94vw);max-height:86vh;font-family:var(--sans)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.dh h2{margin:0;font-size:1rem}
.db{padding:.8rem 1rem 1rem}
.tabs{display:flex;gap:.4rem;margin-bottom:.7rem;flex-wrap:wrap}
.tabs button,.chip{border:1px solid var(--line);background:none;border-radius:2rem;padding:.3rem .8rem}
.tabs button.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.4rem}
.books button,.books a{border:1px solid var(--line);background:var(--card);border-radius:.5rem;padding:.45rem .6rem;text-align:left;text-decoration:none;color:inherit;font-size:.95rem}
.books button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(3rem,1fr));gap:.35rem;margin-top:.6rem}
.chs button,.chs a{border:1px solid var(--line);background:var(--card);border-radius:.5rem;padding:.4rem 0;text-align:center;text-decoration:none;color:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.cn{padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.cn a.r{font-weight:700;color:var(--accent);text-decoration:none;font-size:.8rem}
.cn p{margin:.15rem 0}
/* resultados */
.res{padding:.55rem .1rem;border-bottom:1px solid var(--line);display:block;color:inherit;text-decoration:none}
.res .r{font-family:var(--sans);font-size:.78rem;font-weight:700;color:var(--accent)}
.res .r i{font-style:normal;background:var(--note);color:var(--muted);padding:0 .35em;border-radius:.3em;margin-left:.4em;font-weight:600}
.res p{margin:.1rem 0 0;font-size:1rem}
mark{background:var(--mark);color:inherit;border-radius:.2em;padding:0 .08em}
.info{font-family:var(--sans);color:var(--muted);font-size:.9rem}
.sbar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .6rem;font-family:var(--sans)}
/* inicio e importar */
.hero{max-width:34rem;margin:3vh auto 0;font-family:var(--sans)}
.hero h1{font-family:var(--serif);font-size:1.8rem;margin:.2rem 0;text-align:center}
.hero p.l{color:var(--muted);text-align:center}
.drop{display:block;margin:1.4rem 0 .6rem;border:2px dashed var(--line);border-radius:1rem;padding:1.6rem 1rem;cursor:pointer;background:var(--card);text-align:center}
.drop b{color:var(--accent)}
h2.t{font-family:var(--sans);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1.4rem 0 .5rem}
#toast{position:fixed;left:50%;bottom:4.6rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:2rem;font-family:var(--sans);font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media print{
  #bar,#pager,dialog,#toast,.tools{display:none!important}
  body{background:#fff;color:#000;font-size:11pt;padding:0}
  main{max-width:none;padding:0}
  .nm{background:none;color:#000;border:1px solid #888}
  .note{background:#f4f4f4;border-left-color:#555;break-inside:avoid;color:#000}
  .v.hl,.it.hl{background:none}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header id="bar" hidden>
  <button id="navBtn" aria-label="Elegir libro y capítulo">—</button>
  <input id="q" type="search" placeholder="Is 7,14  ·  palabra  ·  «frase exacta»" enterkeyhint="search" autocomplete="off" aria-label="Buscar">
  <button class="ib" id="searchBtn" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="ib" id="menuBtn" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<main id="main"></main>
<nav id="pager" hidden><button id="prev"></button><button id="next"></button></nav>

<dialog id="navDlg"><div class="dh"><h2>Libros</h2><button class="btn" data-close>Cerrar</button></div>
  <div class="db"><div class="tabs"><a class="btn" href="#/">Inicio</a><a class="btn" href="#/intro">Introducción general</a></div>
  <div class="tabs" id="tabs"><button data-t="AT" class="on">Antiguo Testamento</button><button data-t="NT">Nuevo</button></div>
  <div class="books" id="bookList"></div>
  <div class="tabs" style="margin-top:.8rem"><a class="btn" id="bookIntro" href="#/">Introducción del libro</a></div>
  <div class="chs" id="chList"></div></div></dialog>

<dialog id="notesDlg"><div class="dh"><h2 id="notesTitle">Notas del capítulo</h2><button class="btn" data-close>Cerrar</button></div><div class="db" id="notesBody"></div></dialog>

<dialog id="menuDlg"><div class="dh"><h2>Ajustes</h2><button class="btn" data-close>Cerrar</button></div>
  <div class="db">
    <div class="row"><span>Tamaño de letra</span><span><button class="btn" id="fMinus">A−</button> <button class="btn" id="fPlus">A+</button></span></div>
    <div class="row"><span>Tema</span><select id="theme" class="btn"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></div>
    <div class="row"><span>Mostrar todas las notas<br><small class="info">En pantalla ancha van al margen</small></span><input type="checkbox" id="allNotes"></div>
    <div class="row"><span>Imprimir esta página</span><button class="btn" id="printBtn">Imprimir</button></div>
    <div class="row"><span>Cargar otro archivo</span><label class="btn" for="file2">Elegir…</label><input id="file2" type="file" accept=".json,application/json" hidden></div>
    <div class="row"><span>Borrar el texto de este dispositivo</span><button class="btn d" id="wipe">Borrar</button></div>
    <p class="info" id="stat"></p>
  </div></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const norm = s => s.normalize('NFC').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const strip = s => s.replace(/\{[ABC]\d+\}|⟦\/?i⟧/g, '');
const vbase = l => parseInt(l, 10) || 0;
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- almacenamiento (IndexedDB) ---------- */
const DB = {
  open() { return new Promise((ok, no) => { const r = indexedDB.open('biblia', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((ok, no) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((ok, no) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise((ok, no) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = ok; t.onerror = () => no(t.error); }); }
};

/* ---------- datos e índices ---------- */
const AB = {
 gn:'gen gn gén',ex:'ex éx exo',lv:'lev lv',nm:'num nm núm',dt:'dt deut',jos:'jos',jue:'jue jc',rt:'rt rut',
 '1sm':'1sam 1sm','2sm':'2sam 2sm','1re':'1re 1rey 1reyes','2re':'2re 2rey 2reyes','1cr':'1cr 1cro 1crón','2cr':'2cr 2cro 2crón',
 esd:'esd',neh:'neh',tb:'tob tb',jdt:'jdt',est:'est','1mac':'1mac 1mc','2mac':'2mac 2mc',job:'job',sal:'sal salmos salmo',prov:'prov pr',
 ecl:'ecl qo',cant:'cant cnt',sab:'sab',eclo:'eclo sir ecclo',is:'is',jer:'jer',lam:'lam',bar:'bar',ez:'ez',dn:'dan dn',os:'os',jl:'jl',am:'am',
 abd:'abd',jon:'jon',miq:'miq mi',nah:'nah na',hab:'hab',sof:'sof so',ag:'ag',zac:'zac za',mal:'mal',
 mt:'mt',mc:'mc',lc:'lc',jn:'jn',hch:'hch act hech',rom:'rom rm','1co':'1cor 1co','2co':'2cor 2co',gal:'gal gál',ef:'ef',flp:'flp fil',col:'col',
 '1ts':'1tes 1ts','2ts':'2tes 2ts','1tm':'1tim 1tm','2tm':'2tim 2tm',tit:'tit',flm:'flm',heb:'heb',sant:'sant st',
 '1p':'1pe 1ped 1pd','2p':'2pe 2ped 2pd','1jn':'1jn','2jn':'2jn','3jn':'3jn',jds:'jds jud',ap:'ap apoc'
};
let D = null, BK = [], byId = {}, aliasMap = {}, SEARCH = [], noteNorm = [], noteLoc = {};
const key = s => norm(s).replace(/[\s.]/g, '');

function buildIndex(data) {
  D = data; BK = data.books; byId = {}; aliasMap = {}; SEARCH = []; noteNorm = []; noteLoc = {};
  BK.forEach((b, bi) => {
    byId[b.id] = bi; aliasMap[key(b.name)] = bi; aliasMap[key(b.ab || '')] = bi;
    (AB[b.id] || '').split(' ').filter(Boolean).forEach(a => aliasMap[key(a)] = bi);
    b.chapters.forEach((c, ci) => ['pre', 'body'].forEach(sec => c[sec].forEach((it, ii) => {
      const txt = it[0] === 'v' ? it[2] : it[1];
      if (it[0] === 'v') SEARCH.push({ bi, ci, label: it[1], n: norm(strip(txt)), txt: strip(txt) });
      for (const m of txt.matchAll(/\{([ABC]\d+)\}/g)) noteLoc[m[1]] = [bi, ci, it[0] === 'v' ? it[1] : null];
    })));
  });
  noteNorm = Object.entries(data.notes).map(([id, t]) => ({ id, n: norm(strip(t)) }));
}
const chTitle = (b, c) => c.n === 0 ? 'Prólogo' : b.chapters.length === 1 ? b.name : (b.id === 'sal' ? 'Salmo ' : 'Capítulo ') + c.n + (c.lab ? ' ' + c.lab : '');
const refName = (bi, ci, v) => { const b = BK[bi], c = b.chapters[ci]; const n = c.n === 0 ? 'Prólogo' : c.n;
  return b.chapters.length === 1 ? (v != null ? `${b.name} ${v === 0 ? 'ins.' : v}` : b.name) : `${b.name} ${n}${v != null ? ',' + (v === 0 ? 'ins.' : v) : ''}`; };
const hashFor = (bi, ci, extra) => `#/${BK[bi].id}/${BK[bi].chapters[ci].n}` + (extra ? '/' + extra : '');

/* ---------- referencias ("Is 7,14", "1 Re 3:4-6") ---------- */
function parseRef(txt, strict) {
  const m = txt.trim().match(/^(?:([1-3])\s*)?([^\d]*?)\s*(\d.*)?$/);
  if (!m || !m[2] || !/[a-záéíóúüñ]/i.test(m[2])) return null;
  const k = key((m[1] || '') + m[2]);
  let bi = aliasMap[k], cands = [];
  if (bi == null && !strict) {
    cands = BK.map((b, i) => [b, i]).filter(([b]) => key(b.name).startsWith(k)).map(([, i]) => i);
    if (cands.length === 1) bi = cands[0];
  }
  if (bi == null) return cands.length ? { cands } : null;
  const rest = (m[3] || '').trim(); let ch = BK[bi].chapters[0].n === 0 ? 1 : BK[bi].chapters[0].n, v1 = null, v2 = null;
  if (rest) {
    const r = rest.match(/^(\d+)(?:\s*[,:.]\s*(\d+)(?:\s*[-–]\s*(\d+))?|\s+(\d+)(?:\s*[-–]\s*(\d+))?)?$/);
    if (!r) return null;
    ch = +r[1]; v1 = r[2] ? +r[2] : r[4] ? +r[4] : null; v2 = r[3] ? +r[3] : r[5] ? +r[5] : null;
  } else if (strict) return null;
  const ci = BK[bi].chapters.findIndex(c => c.n === ch);
  if (ci < 0) return null;
  return { bi, ci, v1, v2 };
}
const rangeHash = r => hashFor(r.bi, r.ci, r.v1 != null ? r.v1 + (r.v2 ? '-' + r.v2 : '') : '');

/* ---------- texto con cursivas y notas ---------- */
function renderText(parent, s) {
  let cur = parent;
  s.split(/(\{[ABC]\d+\}|⟦\/?i⟧)/).forEach(p => {
    if (!p) return;
    if (p === '⟦i⟧') { const i = el('i'); parent.append(i); cur = i; return; }
    if (p === '⟦/i⟧') { cur = parent; return; }
    const m = p.match(/^\{([ABC]\d+)\}$/);
    if (!m) { cur.append(p); return; }
    const b = el('button', 'nm', m[1].slice(1)); b.dataset.id = m[1]; b.type = 'button'; b.setAttribute('aria-label', 'Nota ' + m[1].slice(1));
    cur.append(b);
  });
}
function linkText(parent, text) {   // enlaza referencias "Is. 65. 17" solo si el libro se reconoce sin ambigüedad
  const re = /(?<![\wáéíóúñ])((?:[1-3]\s)?[A-ZÁÉÍÓÚ][a-záéíóúñ]{1,7})\.?\s(\d{1,3})[.,]\s?(\d{1,3})(?:\s?[-–]\s?(\d{1,3}))?/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    const r = parseRef(`${m[1]} ${m[2]},${m[3]}${m[4] ? '-' + m[4] : ''}`, true);
    if (!r) continue;
    parent.append(text.slice(last, m.index));
    const a = el('a', null, m[0]); a.href = rangeHash(r); parent.append(a); last = m.index + m[0].length;
  }
  parent.append(text.slice(last));
}
function noteNode(id) {
  const n = el('div', 'note'); n.dataset.id = id; n.hidden = true;
  (D.notes[id] || '(nota no encontrada)').split('\n').forEach((para, i) => {
    const p = el('p'); if (i === 0) p.append(el('b', null, id.slice(1) + '.'));
    para.split(/(⟦\/?i⟧)/).reduce((st, t) => { if (t === '⟦i⟧') return true; if (t === '⟦/i⟧') return false;
      const host = st ? el('i') : p; linkText(host, t); if (st) p.append(host); return st; }, false);
    n.append(p);
  });
  return n;
}
function idsIn(s) { return [...s.matchAll(/\{([ABC]\d+)\}/g)].map(m => m[1]); }

/* ---------- elementos del texto bíblico ---------- */
function itemNode(it) {
  const k = it[0], txt = k === 'v' ? it[2] : it[1]; let box = el('div', 'it'), body;
  if (k === 'v') {
    box.classList.add('v'); box.id = 'v' + it[1]; body = el('div', 'vb');
    const lbl = it[1] === 0 ? 'ins.' : it[1], num = el('span', 'vn' + (it[1] === 0 ? ' ins' : ''), lbl);
    num.dataset.v = it[1]; num.title = 'Copiar versículo'; body.append(num);
  } else if (k === 'h' || k === 'H') body = el('h2', 'sec' + (k === 'H' ? ' big' : ''));
  else if (k === 'h2') body = el('h3', 'sub');
  else if (k === 't') body = el('h3', 'pe');
  else if (k === 'r') body = el('div', 'par');
  else body = el('p', 'prose');
  if (k === 'r') { body.append('Paralelos: '); linkText(body, strip(txt)); } else renderText(body, txt);
  box.append(body);
  const ids = idsIn(txt);
  if (ids.length) { const w = el('div', 'notes'); ids.forEach(id => w.append(noteNode(id))); box.append(w); }
  return box;
}
function docNode(items) { const d = el('div', 'doc'); items.forEach(it => d.append(itemNode(it))); return d; }

/* ---------- vistas ---------- */
let cur = null;     // {bi, ci} del capítulo abierto
function setChrome(title, pager) {
  $('#navBtn').textContent = title; document.title = title + ' · Biblia'; $('#pager').hidden = !pager; if (!pager) cur = null;
}
function seq() { const a = []; BK.forEach((b, bi) => b.chapters.forEach((c, ci) => a.push([bi, ci]))); return a; }
function renderChapter(bi, ci, hv) {
  const b = BK[bi], c = b.chapters[ci]; cur = { bi, ci };
  const main = $('#main'); main.replaceChildren();
  if (c.pre.length) main.append(docNode(c.pre));
  main.append(el('div', 'bk', b.name), el('h1', 'ch', chTitle(b, c)));
  const tools = el('div', 'tools'); main.append(tools);
  const nCh = new Set(); [...c.pre, ...c.body].forEach(it => idsIn(it[0] === 'v' ? it[2] : it[1]).forEach(i => nCh.add(i)));
  if (nCh.size) { const nb = el('button', 'btn', `Notas del capítulo (${nCh.size})`); nb.onclick = () => openChapterNotes(b, c, [...nCh]); tools.append(nb); }
  if (b.intro.length) { const ib = el('a', 'btn', 'Introducción del libro'); ib.href = '#/' + b.id; tools.append(ib); }
  main.append(docNode(c.body));
  applyNotesMode();
  const all = seq(), pos = all.findIndex(x => x[0] === bi && x[1] === ci), P = all[pos - 1], N = all[pos + 1];
  const lab = x => { const t = refName(x[0], x[1]); return t; };
  $('#prev').disabled = !P; $('#next').disabled = !N;
  $('#prev').textContent = P ? '‹ ' + lab(P) : ''; $('#prev').onclick = () => P && (location.hash = hashFor(...P));
  $('#next').textContent = N ? lab(N) + ' ›' : ''; $('#next').onclick = () => N && (location.hash = hashFor(...N));
  setChrome(refName(bi, ci), true);
  if (hv) focusTarget(hv); else window.scrollTo(0, 0);
  LS.set('last', location.hash);
}
function focusTarget(hv) {
  if (hv[0] === '@') {     // salto a una nota concreta
    const nm = document.querySelector(`.nm[data-id="${hv.slice(1)}"]`); if (!nm) return;
    const box = nm.closest('.it'); box.classList.add('hl'); toggleNote(nm, true); box.scrollIntoView({ block: 'start' }); return;
  }
  const r = hv.match(/^(\d+)(?:-(\d+))?/); if (!r) return; const a = +r[1], z = r[2] ? +r[2] : a;
  document.querySelectorAll('.v').forEach(v => { const n = vbase(v.id.slice(1)); if (n >= a && n <= z && !(n === 0 && a !== 0)) v.classList.add('hl'); });
  (document.getElementById('v' + a) || document.querySelector('.v.hl'))?.scrollIntoView({ block: 'start' });
}
function renderDocPage(title, items, kicker, extra) {
  const main = $('#main'); main.replaceChildren();
  main.append(el('div', 'bk', kicker), el('h1', 'ch', title)); if (extra) main.append(extra);
  main.append(docNode(items)); applyNotesMode(); setChrome(title, false); window.scrollTo(0, 0);
}
function renderBook(bi) {
  const b = BK[bi], chs = el('div', 'chs');
  b.chapters.forEach((c, ci) => { const a = el('a', null, c.n === 0 ? 'Pról.' : c.n); a.href = hashFor(bi, ci); chs.append(a); });
  const box = el('div'); box.append(el('h2', 't', 'Capítulos'), chs);
  renderDocPage(b.name, b.intro, b.t === 'AT' ? 'Antiguo Testamento' : 'Nuevo Testamento', box);
}
function renderHome() {
  const main = $('#main'); main.replaceChildren(); const h = el('div', 'hero');
  h.append(el('h1', null, 'Sagrada Biblia'), el('p', 'l', 'Cantera–Iglesias · BAC, 1975'));
  const t = el('div', 'tools'); t.style.justifyContent = 'center';
  const last = LS.get('last', ''); if (last && /^#\/[^/]+\/\d+/.test(last)) { const a = el('a', 'btn p', 'Continuar leyendo'); a.href = last; t.append(a); }
  const i = el('a', 'btn', 'Introducción general'); i.href = '#/intro'; t.append(i); h.append(t);
  [['AT', 'Antiguo Testamento'], ['NT', 'Nuevo Testamento']].forEach(([k, name]) => {
    h.append(el('h2', 't', name)); const g = el('div', 'books');
    BK.forEach((b, bi) => { if (b.t !== k) return; const a = el('a', null, b.name); a.href = b.intro.length ? '#/' + b.id : hashFor(bi, 0); g.append(a); });
    h.append(g);
  });
  main.append(h); setChrome('Inicio', false); window.scrollTo(0, 0);
}
function toggleNote(nm, forceOpen) {
  const box = nm.closest('.it'), n = box.querySelector(`.note[data-id="${nm.dataset.id}"]`); if (!n) return;
  if (n.dataset.open && !forceOpen) { delete n.dataset.open; nm.classList.remove('on'); } else { n.dataset.open = 1; nm.classList.add('on'); }
  applyNotesMode();
}
function applyNotesMode() {
  const all = $('#allNotes').checked;
  document.body.classList.toggle('allnotes', all);
  document.body.classList.toggle('wide', innerWidth >= 1000);
  document.querySelectorAll('.note').forEach(n => { n.hidden = !all && !n.dataset.open; });
}
function openChapterNotes(b, c, ids) {
  $('#notesTitle').textContent = `Notas · ${b.name} ${c.n === 0 ? 'Prólogo' : c.n}`; const body = $('#notesBody'); body.replaceChildren();
  ids.forEach(id => {
    const w = el('div', 'cn'), loc = noteLoc[id]; const a = el('a', 'r', loc && loc[2] != null ? (loc[2] === 0 ? 'inscripción' : 'v. ' + loc[2]) : 'texto');
    a.href = hashFor(loc[0], loc[1], '@' + id); a.onclick = () => $('#notesDlg').close(); w.append(a);
    noteNode(id).childNodes.forEach(p => w.append(p.cloneNode(true))); w.querySelector('.note,[hidden]')?.removeAttribute('hidden'); body.append(w);
  });
  $('#notesDlg').showModal();
}
$('#main').addEventListener('click', e => {
  const nm = e.target.closest('.nm'), vn = e.target.closest('.vn');
  if (nm) toggleNote(nm);
  else if (vn && cur) {
    const v = BK[cur.bi].chapters[cur.ci].body.find(x => x[0] === 'v' && String(x[1]) === vn.dataset.v);
    if (v) navigator.clipboard?.writeText(`${refName(cur.bi, cur.ci, v[1])}: ${strip(v[2])}`).then(() => toast('Versículo copiado'), () => {});
  }
});

/* ---------- búsqueda ---------- */
let scope = { t: true, n: true };
function tokens(q) { const out = []; q.replace(/[«"“]([^»"”]+)[»"”]|(\S+)/g, (_, ph, w) => { const s = norm(ph || w).trim(); if (s) out.push(s); }); return out; }
function hl(parent, text, toks) {
  const n = norm(text), spans = [];
  toks.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) >= 0) { spans.push([i, i + t.length]); i += t.length; } });
  spans.sort((a, b) => a[0] - b[0]); let last = 0;
  for (const [s, e] of spans) { if (s < last) continue; parent.append(text.slice(last, s)); parent.append(el('mark', null, text.slice(s, e))); last = e; }
  parent.append(text.slice(last));
}
function renderSearch(q) {
  const main = $('#main'); main.replaceChildren(); setChrome('Búsqueda', false);
  const bar = el('div', 'sbar');
  [['t', 'Texto'], ['n', 'Notas']].forEach(([k, l]) => { const c = el('button', 'chip' + (scope[k] ? ' on' : ''), l); c.onclick = () => { scope[k] = !scope[k]; renderSearch($('#q').value); }; bar.append(c); });
  main.append(bar);
  const ref = parseRef(q);
  if (ref && ref.bi != null) { const a = el('a', 'res'); a.href = rangeHash(ref);
    a.append(el('span', 'r', 'Ir a ' + refName(ref.bi, ref.ci, ref.v1) + (ref.v2 ? '-' + ref.v2 : ''))); main.append(a); }
  else if (ref && ref.cands) { const d = el('div', 'info', '¿Quiso decir? '); ref.cands.slice(0, 8).forEach(i => { const a = el('a', null, BK[i].name + ' '); a.href = '#/' + BK[i].id; d.append(a); }); main.append(d); }
  const toks = tokens(q);
  if (!toks.length) { main.append(el('p', 'info', 'Escriba una referencia (Is 7,14), una palabra o una frase entre comillas. La búsqueda ignora acentos y mayúsculas.')); return; }
  const hits = [];
  if (scope.t) for (const r of SEARCH) if (toks.every(t => r.n.includes(t))) hits.push({ k: 'v', ...r });
  if (scope.n) for (const r of noteNorm) if (toks.every(t => r.n.includes(t))) hits.push({ k: 'n', ...r });
  main.append(el('p', 'info', `${hits.length} resultado${hits.length === 1 ? '' : 's'}`));
  const list = el('div'); main.append(list); let shown = 0;
  const more = el('button', 'btn', 'Ver más'); more.onclick = draw; main.append(more);
  function draw() {
    hits.slice(shown, shown + 100).forEach(h => {
      const a = el('a', 'res'); let loc, txt, tag = null;
      if (h.k === 'v') { loc = [h.bi, h.ci, h.label]; txt = h.txt; a.href = hashFor(h.bi, h.ci, String(h.label)); }
      else { loc = noteLoc[h.id]; if (!loc) return; txt = strip(D.notes[h.id]).replace(/\n/g, ' '); tag = 'nota ' + h.id.slice(1); a.href = hashFor(loc[0], loc[1], '@' + h.id); }
      const r = el('span', 'r', refName(loc[0], loc[1], loc[2])); if (tag) r.append(el('i', null, tag));
      const p = el('p'); hl(p, txt, toks); a.append(r, p); list.append(a);
    });
    shown += 100; more.hidden = shown >= hits.length;
  }
  draw();
}

/* ---------- navegador de libros ---------- */
let tab = 'AT', pickBook = 0;
function drawBooks() {
  const list = $('#bookList'); list.replaceChildren();
  BK.forEach((b, i) => { if (b.t !== tab) return; const x = el('button', i === pickBook ? 'on' : '', b.name); x.onclick = () => { pickBook = i; drawBooks(); }; list.append(x); });
  const chs = $('#chList'); chs.replaceChildren(); const b = BK[pickBook];
  $('#bookIntro').href = '#/' + b.id; $('#bookIntro').hidden = !b.intro.length;
  b.chapters.forEach((c, ci) => { const x = el('button', null, c.n === 0 ? 'Pról.' : c.n); x.onclick = () => { $('#navDlg').close(); location.hash = hashFor(pickBook, ci); }; chs.append(x); });
  document.querySelectorAll('#tabs button').forEach(t => t.classList.toggle('on', t.dataset.t === tab));
}
$('#tabs').onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; pickBook = BK.findIndex(b => b.t === t); drawBooks(); } };
$('#navBtn').onclick = () => { if (cur) { pickBook = cur.bi; tab = BK[cur.bi].t; } drawBooks(); $('#navDlg').showModal(); };
$('#navDlg').addEventListener('click', e => { if (e.target.closest('a')) $('#navDlg').close(); });
$('#bookIntro').addEventListener('click', () => $('#navDlg').close());

/* ---------- ruteo ---------- */
let qT;
function route() {
  if (!D) return;
  clearTimeout(qT); $('#bar').classList.remove('s'); closeAll();
  const p = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  if (!p[0]) return renderHome();
  if (p[0] === 'buscar') { const q = p.slice(1).join('/'); $('#q').value = q; return renderSearch(q); }
  if (p[0] === 'intro') return renderDocPage('Introducción general', D.front, 'Cantera–Iglesias · BAC, 1975');
  const bi = byId[p[0]]; if (bi == null) return location.replace('#/');
  if (p[1] === undefined || p[1] === '') return renderBook(bi);
  const ch = parseInt(p[1], 10); let ci = BK[bi].chapters.findIndex(c => c.n === ch); if (ci < 0) ci = 0;
  renderChapter(bi, ci, p[2] || null);
}
function closeAll() { document.querySelectorAll('dialog[open]').forEach(d => d.close()); }
addEventListener('hashchange', route);
$('#q').addEventListener('input', e => { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { if (v.trim().length >= 2) { history.replaceState(null, '', '#/buscar/' + encodeURIComponent(v)); renderSearch(v); } }, 220); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qT); const r = parseRef(e.target.value, false); e.target.blur(); if (r && r.bi != null) location.hash = rangeHash(r); } });
$('#searchBtn').onclick = () => { $('#bar').classList.add('s'); $('#q').focus(); };
addEventListener('keydown', e => {
  if (e.target.matches('input,select') || e.metaKey || e.ctrlKey) return;
  if (e.key === '/') { e.preventDefault(); $('#bar').classList.add('s'); $('#q').focus(); }
  else if (e.key === 'ArrowLeft' && cur) $('#prev').click(); else if (e.key === 'ArrowRight' && cur) $('#next').click();
});
addEventListener('resize', () => applyNotesMode());

/* ---------- ajustes ---------- */
$('#menuBtn').onclick = () => { $('#stat').textContent = D ? `${BK.length} libros · ${SEARCH.length.toLocaleString('es')} versículos · ${Object.keys(D.notes).length.toLocaleString('es')} notas` : ''; $('#menuDlg').showModal(); };
document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
let fs = LS.get('fs', 1.12);
const setFs = v => { fs = Math.min(1.8, Math.max(0.9, v)); document.documentElement.style.setProperty('--fs', fs + 'rem'); LS.set('fs', fs); };
$('#fMinus').onclick = () => setFs(fs - .08); $('#fPlus').onclick = () => setFs(fs + .08);
const setTheme = t => { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; LS.set('theme', t); };
$('#theme').onchange = e => setTheme(e.target.value);
$('#allNotes').onchange = e => { LS.set('allnotes', e.target.checked); applyNotesMode(); };
$('#printBtn').onclick = () => { $('#menuDlg').close(); setTimeout(() => window.print(), 150); };
$('#wipe').onclick = async () => { if (confirm('¿Borrar el texto de este dispositivo? Podrá volver a cargarlo después.')) { await DB.del('bible'); location.hash = ''; location.reload(); } };
setFs(fs); $('#theme').value = LS.get('theme', 'auto'); setTheme($('#theme').value); $('#allNotes').checked = LS.get('allnotes', false);

/* ---------- importación ---------- */
function showImport(msg) {
  $('#bar').hidden = true; $('#pager').hidden = true; const m = $('#main'); m.replaceChildren();
  const h = el('div', 'hero');
  h.innerHTML = '<h1>Visor de la Sagrada Biblia</h1><p class="l">Navegación por libro y capítulo, búsqueda por referencia o palabra y notas junto a cada versículo. Funciona sin conexión.</p>' +
    '<label class="drop"><b>Elegir el archivo <code>biblia.json</code></b><br><span class="info">El texto se guarda solo en este dispositivo; no se envía a ningún servidor.</span><input id="file" type="file" accept=".json,application/json" hidden></label>' +
    '<p class="info" id="msg"></p>';
  m.append(h); $('#msg').textContent = msg || '';
  $('#file').onchange = e => importFile(e.target.files[0]);
}
const validData = d => d && d.format === 2 && Array.isArray(d.books) && d.books.length && d.books[0].chapters && d.notes && Array.isArray(d.front);
async function importFile(f) {
  if (!f) return;
  const msg = $('#msg'); if (msg) msg.textContent = 'Leyendo archivo…'; toast('Leyendo archivo…');
  try {
    const data = JSON.parse(await f.text());
    if (!validData(data)) throw new Error(data && data.books ? 'es una versión anterior del archivo; use la nueva biblia.json.' : 'el archivo no tiene el formato esperado.');
    await DB.set('bible', data); try { await navigator.storage?.persist?.(); } catch {}
    start(data);
  } catch (err) { showImport('No se pudo cargar: ' + err.message); toast('No se pudo cargar'); }
}
$('#file2').onchange = e => { $('#menuDlg').close(); importFile(e.target.files[0]); };

function start(data) {
  buildIndex(data); $('#bar').hidden = false; $('#toast').classList.remove('on');
  route();
}
(async () => {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { const saved = await DB.get('bible'); if (validData(saved)) return start(saved); if (saved) return showImport('Hay una versión nueva del archivo de datos: cárguela de nuevo.'); } catch {}
  showImport();
})();
</script>
